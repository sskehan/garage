<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyGarage</title>
<meta name="theme-color" content="#14181c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app — dark header band, scrolling content, bottom tab bar with a centre "Log" button; detail views and forms open as full-screen sheets */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#f4f6f7; --line:#d5dae0; --ink:#14181c; --ink-2:#4b5560; --ink-3:#77818d;
  --accent:#0d7a6a; --accent-ink:#ffffff; --accent-soft:#d8efe9; --amber:#c27613; --amber-soft:#f7e8d0;
  --ok:#2f7a4b; --warn:#b5610f; --bad:#b3362c; --bad-soft:#f6dcd9; --band:#14181c;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111417; --surface:#1a1f23; --surface-2:#21272c; --line:#323a41; --ink:#e8ecef; --ink-2:#b0b9c2; --ink-3:#85909b;
  --accent:#3cc4ad; --accent-ink:#06201b; --accent-soft:#17332e; --amber:#efa443; --amber-soft:#3a2c17;
  --ok:#5fbf84; --warn:#eaa055; --bad:#ec7a70; --bad-soft:#3d1f1c; --band:#0b0d0f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:#e8ecef;
  background-image:linear-gradient(90deg,rgba(255,255,255,.03) 50%,transparent 50%);background-size:8px 8px}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0;line-height:1.1}
.brand small{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.12em;color:#9aa4b0;text-transform:uppercase}
.brand small.warn{color:#efa443}
.brand small.ok{color:#5fe0c9}
.lst{display:flex;flex-direction:column;gap:8px}
.lst .item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.lst .item div{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.big{min-height:52px;font-size:16px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.top .btn{background:transparent;border-color:#4a535c;color:#e8ecef}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
section.view{padding-block:16px;display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:34px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.vcard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;cursor:pointer;width:100%}
.vtop{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center}
.thumb{width:84px;height:64px;border-radius:6px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--ink-3)}
.thumb svg{width:44px;height:44px}
.vcard h3{font-size:21px;line-height:1.1}
.plate{font:500 13px/1 var(--f-mono);letter-spacing:.1em;border:1.5px solid currentColor;border-radius:4px;padding:3px 6px;display:inline-block;white-space:nowrap}
.vmeta{font-size:13px;color:var(--ink-2);margin-top:3px}
.vstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);padding-top:8px;gap:4px}
.vstats div{min-width:0}
.vstats b{display:block;font:600 18px/1.15 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dues{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.over{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.tag.soon{background:var(--amber-soft);color:var(--warn);border-color:transparent;font-weight:600}
.tag.ok{color:var(--ok);border-color:transparent;background:transparent;padding-left:0}
.tag.acc{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--ink-2);background:var(--surface);display:flex;flex-direction:column;gap:12px;align-items:center}
.banner{border:1px solid var(--warn);color:var(--ink);background:var(--amber-soft);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner>span:first-child{flex:1;min-width:180px}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)}
.banner ul{margin:0;padding-left:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3);cursor:pointer;position:relative;min-height:58px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .logbtn span.disc{width:54px;height:54px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:3px solid var(--surface)}
nav.tabs .logbtn span.disc svg{width:26px;height:26px}
nav.tabs .logbtn{color:var(--ink-2)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px;font-weight:600}
.badge.soon{background:var(--warn)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-head .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.sheet-head h2{flex:1;min-width:0;font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .sp{flex:1}
dl.kv{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:6px 12px;margin:0}
dl.kv dt{color:var(--ink-3);font-size:13px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.hero img{width:100%;max-height:220px;object-fit:cover;border-radius:var(--r);grid-column:1/-1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tiles div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.tiles b{display:block;font:600 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles small{display:block;font-size:12px;color:var(--ink-3)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:500;min-height:64px}
.quick button svg{width:24px;height:24px;color:var(--accent)}
.hist{display:flex;flex-direction:column}
.hyear{font:600 15px var(--f-display);letter-spacing:.04em;color:var(--ink-2);padding:12px 2px 4px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.hrow .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.hrow .ic svg{width:19px;height:19px}
.hrow .ic.fuel,.hrow .ic.charge{color:var(--accent)} .hrow .ic.service{color:var(--amber)} .hrow .ic.expense{color:var(--ink-2)} .hrow .ic.odo{color:var(--ink-3)}
.hrow .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow .r small{display:block;font-size:12px;color:var(--ink-3)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.field .hint{font-size:12px;color:var(--ink-3)}
.field.bigodo input{font:600 28px/1.1 var(--f-mono);letter-spacing:.04em;min-height:58px;padding:8px 12px}
.field.mid input{font:600 20px/1.1 var(--f-mono);min-height:50px}
.check-inline{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check-inline input{width:22px;height:22px;flex:0 0 auto;margin:0}
.toggles{display:flex;gap:16px;flex-wrap:wrap}
.fs-title{grid-column:1/-1;font:600 17px var(--f-display);margin-top:8px;padding-top:10px;border-top:1px solid var(--line);letter-spacing:.02em}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}.form .half-m{grid-column:auto}}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-left:1px solid var(--line);background:none;padding:10px 4px;cursor:pointer;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.seg button:first-child{border-left:0}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.vpick button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;min-height:52px}
.vpick button b{display:block;font:600 17px/1.1 var(--f-display)}
.vpick button small{font:12px var(--f-mono);color:var(--ink-3)}
.vpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.preview{border-radius:var(--r);padding:12px 14px;background:var(--band);color:#e8ecef;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.preview div{min-width:0}
.preview b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums;color:#5fe0c9}
.preview small{display:block;color:#9aa4b0;font-size:12px}
.preview .msg{color:#c6ced6;font-size:13.5px}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;min-height:32px}
.files{display:flex;gap:8px;flex-wrap:wrap}
.fileth{position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;text-align:center;color:var(--ink-2);text-decoration:none}
.fileth img{width:100%;height:100%;object-fit:cover}
.fileth .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:999px;width:24px;height:24px;cursor:pointer;line-height:1}
.duelist{display:flex;flex-direction:column;gap:8px}
.due{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 0;overflow:hidden}
.due .bar{align-self:stretch;background:var(--line)}
.due.over .bar{background:var(--bad)} .due.soon .bar{background:var(--warn)} .due.ok .bar{background:var(--ok)}
.due b{font-weight:600}
.due .s{font-size:13px;color:var(--ink-2)}
.due .when{font:600 15px var(--f-display);text-align:right;white-space:nowrap}
.due.over .when{color:var(--bad)} .due.soon .when{color:var(--warn)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:13px var(--f-body);fill:var(--ink-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:5px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(80px,34%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb .track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hb .fill{height:100%;background:var(--accent);border-radius:3px}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;font-size:13px;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.tbl thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.tbl tfoot td{font-weight:600;border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.menu button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.menu button b{font:600 19px var(--f-display)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
textarea.csv{width:100%;min-height:140px;font:12px var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.help{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.help h4{margin:10px 0 2px;font:600 16px var(--f-display);color:var(--ink)}
.help p{margin:4px 0}
details summary{padding:4px 0}
.paper{background:#fff;color:#111;border-radius:6px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.2);overflow-x:auto}
#report{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#111!important;padding:0!important}
  body::before{display:none!important}
  body>*:not(#report){display:none!important}
  #report{display:block!important}
}
@media (prefers-reduced-motion:no-preference){.vcard,.btn,.chip,.quick button{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">MyGarage<small id="hdrsub" data-act="goBackup" style="cursor:pointer">Loading…</small></div>
  <button class="btn" id="addVehBtn" type="button" data-act="newVehicle">+ Vehicle</button>
</div></header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="garage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M7 20v-6h10v6"/></svg>Garage</button>
  <button type="button" data-tab="due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Due<span class="badge" id="dueBadge" hidden></span></button>
  <button type="button" class="logbtn" data-act="quickLog" aria-label="Log fuel, km, service or expense"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Log</button>
  <button type="button" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</div></nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="report"></div>
<input type="file" id="restoreIn" accept=".zip,application/zip" hidden>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="receiptIn" accept="image/*,application/pdf" multiple hidden>

<script src="jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
